[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_test.py"]
# Keep the test database between runs — creating it from scratch on every
# invocation is the single biggest cost in a Django test suite.
addopts = "--reuse-db"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, flake8-bugbear, and the
# Django-specific checks.
select = ["E", "F", "I", "UP", "B", "DJ"]

[tool.ruff.lint.per-file-ignores]
# Generated by startproject and by makemigrations — not worth reformatting.
"config/settings.py" = ["E501"]
"**/migrations/*.py" = ["E501"]
